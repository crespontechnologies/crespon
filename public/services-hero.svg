<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Crespon at the center connected to six services: web, software, product, SEO, marketing and business systems" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#050912"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#0ea5e9" stop-opacity=".28"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
    <radialGradient id="hub" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#12304f"/><stop offset="1" stop-color="#0b1220"/></radialGradient>
  </defs>
  <rect width="480" height="360" fill="url(#bg)"/>
  <circle cx="240" cy="180" r="170" fill="url(#glow)"/>
  <ellipse cx="240" cy="180" rx="170" ry="125" fill="none" stroke="#38bdf8" stroke-opacity=".18" stroke-dasharray="2 6"/>

  <!-- Connectors -->
  <g stroke="#38bdf8" stroke-opacity=".55" stroke-width="1.4" stroke-dasharray="4 4" fill="none">
    <line x1="240" y1="140" x2="240" y2="70"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="274" y1="160" x2="352" y2="127"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="274" y1="200" x2="352" y2="233"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="240" y1="220" x2="240" y2="290"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="206" y1="200" x2="128" y2="233"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="206" y1="160" x2="128" y2="127"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.6s" repeatCount="indefinite"/></line>
  </g>

  <!-- Hub -->
  <circle cx="240" cy="180" r="46" fill="none" stroke="#38bdf8" stroke-opacity=".35"><animate attributeName="r" values="46;58;46" dur="3.2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".35;0;.35" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="240" cy="180" r="40" fill="url(#hub)" stroke="#38bdf8"/>
  <text x="240" y="178" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1.2" fill="#f8fafc">CRESPON</text>
  <text x="240" y="192" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="7.5" fill="#94a3b8">Bridge to growth</text>

  <!-- Service nodes -->
  <g font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#e2e8f0">
    <rect x="184" y="42" width="112" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".5"/><circle cx="200" cy="56" r="3" fill="#38bdf8"/><text x="210" y="60">Web Development</text>
    <rect x="331" y="113" width="112" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".5"/><circle cx="347" cy="127" r="3" fill="#38bdf8"/><text x="357" y="131">Software &amp; Apps</text>
    <rect x="331" y="219" width="112" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".5"/><circle cx="347" cy="233" r="3" fill="#38bdf8"/><text x="357" y="237">Product &amp; MVP</text>
    <rect x="184" y="290" width="112" height="28" rx="14" fill="#0f172a" stroke="#d4af37" stroke-opacity=".6"/><circle cx="200" cy="304" r="3" fill="#d4af37"/><text x="210" y="308">SEO &amp; Visibility</text>
    <rect x="37" y="219" width="112" height="28" rx="14" fill="#0f172a" stroke="#d4af37" stroke-opacity=".6"/><circle cx="53" cy="233" r="3" fill="#d4af37"/><text x="63" y="237">Digital Marketing</text>
    <rect x="37" y="113" width="112" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".5"/><circle cx="53" cy="127" r="3" fill="#38bdf8"/><text x="63" y="131">Business Systems</text>
  </g>
</svg>
