<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Four stacked layers: strategy, design, engineering and growth" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#050912"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#0ea5e9" stop-opacity=".25"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="480" height="360" fill="url(#bg)"/>
  <circle cx="110" cy="70" r="150" fill="url(#glow)"/>
  <circle cx="420" cy="320" r="130" fill="url(#glow)" opacity=".6"/>

  <!-- Connectors -->
  <g fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity=".7">
    <path d="M68 92V140H76"/>
    <path d="M104 168V216H112"/>
    <path d="M140 244V292H148"/>
  </g>

  <!-- Goal pill -->
  <path d="M332 64H341V52H350" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="3 3" opacity=".7"/>
  <rect x="350" y="40" width="100" height="24" rx="12" fill="#d4af37" fill-opacity=".12" stroke="#d4af37" stroke-opacity=".6"/>
  <text x="400" y="56" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#d4af37">Business goal</text>

  <!-- Layer 1: Strategy -->
  <rect x="40" y="36" width="292" height="56" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".5"/>
  <circle cx="68" cy="64" r="14" fill="#0b1220" stroke="#38bdf8"/>
  <circle cx="68" cy="64" r="7" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="68" cy="64" r="2.5" fill="#38bdf8"/>
  <text x="94" y="60" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Strategy</text>
  <text x="94" y="77" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Goals, audience, revenue</text>

  <!-- Layer 2: Design -->
  <rect x="76" y="112" width="292" height="56" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".5"/>
  <circle cx="104" cy="140" r="14" fill="#0b1220" stroke="#38bdf8"/>
  <rect x="97" y="133" width="14" height="14" rx="2.5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M97 139h14M103 139v8" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="130" y="136" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Design</text>
  <text x="130" y="153" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Brand, UX, conversion flows</text>

  <!-- Layer 3: Engineering -->
  <rect x="112" y="188" width="292" height="56" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".5"/>
  <circle cx="140" cy="216" r="14" fill="#0b1220" stroke="#38bdf8"/>
  <path d="M143.5 210.5L148 216l-4.5 5.5M136.5 210.5L132 216l4.5 5.5" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="166" y="212" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Engineering</text>
  <text x="166" y="229" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Next.js, Spring Boot, SQL</text>

  <!-- Layer 4: Growth -->
  <rect x="148" y="264" width="292" height="56" rx="10" fill="#0f172a" stroke="#d4af37" stroke-opacity=".6"/>
  <circle cx="176" cy="292" r="14" fill="#0b1220" stroke="#d4af37"/>
  <polyline points="168,298 174,291 178,295 185,286" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="202" y="288" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Growth</text>
  <text x="202" y="305" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#94a3b8">SEO, analytics, support</text>
</svg>
