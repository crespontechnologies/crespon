    <rect x="62" y="154" width="30" height="6" rx="3" fill="#38bdf8"/>
    <rect x="62" y="174" width="60" height="6" rx="3" fill="#38bdf8"/>
    <rect x="128" y="174" width="72" height="6" rx="3" fill="#94a3b8" opacity=".5"/>
    <rect x="74" y="188" width="88" height="6" rx="3" fill="#d4af37"/>
  </g>

  <!-- Performance gauge -->
  <rect x="252" y="84" width="180" height="124" rx="8" fill="#0b1220" stroke="#1e293b"/>
  <circle cx="342" cy="138" r="32" fill="none" stroke="#1e293b" stroke-width="7"/>
  <circle cx="342" cy="138" r="32" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round" stroke-dasharray="188 201" transform="rotate(-90 342 138)"/>
  <text x="342" y="145" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">98</text>
  <text x="342" y="192" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9.5" fill="#94a3b8">Core Web Vitals</text>

