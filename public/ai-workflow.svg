<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Business inputs flow through an AI layer with human review into chat assistants, automation and insights" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#050912"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#0ea5e9" stop-opacity=".3"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
    <radialGradient id="core" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#12304f"/><stop offset="1" stop-color="#0b1220"/></radialGradient>
  </defs>
  <rect width="480" height="360" fill="url(#bg)"/>
  <circle cx="240" cy="170" r="150" fill="url(#glow)"/>

  <!-- Connectors -->
  <g fill="none" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.4" stroke-dasharray="4 4">
    <path d="M128 82C160 82 150 160 180 170"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M128 172H178"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M128 262C160 262 150 180 180 172"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M302 170C330 160 320 82 352 82"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M302 172H352"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M302 172C320 180 330 262 352 262"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.6s" repeatCount="indefinite"/></path>
  </g>

  <!-- Inputs -->
  <g font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">
    <rect x="20" y="60" width="108" height="44" rx="10" fill="#0f172a" stroke="#334155"/><text x="36" y="86">Enquiries</text>
    <rect x="20" y="150" width="108" height="44" rx="10" fill="#0f172a" stroke="#334155"/><text x="36" y="176">Documents</text>
    <rect x="20" y="240" width="108" height="44" rx="10" fill="#0f172a" stroke="#334155"/><text x="36" y="266">Business data</text>
  </g>

  <!-- AI core -->
  <circle cx="240" cy="172" r="62" fill="none" stroke="#38bdf8" stroke-opacity=".3"><animate attributeName="r" values="62;72;62" dur="3.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".3;0;.3" dur="3.4s" repeatCount="indefinite"/></circle>
  <circle cx="240" cy="172" r="58" fill="url(#core)" stroke="#38bdf8"/>
  <g stroke="#38bdf8" stroke-opacity=".4" stroke-width="1">
    <line x1="212" y1="146" x2="240" y2="136"/><line x1="212" y1="146" x2="240" y2="162"/><line x1="212" y1="172" x2="240" y2="162"/><line x1="212" y1="172" x2="240" y2="188"/><line x1="212" y1="198" x2="240" y2="188"/><line x1="212" y1="198" x2="240" y2="214"/>
    <line x1="268" y1="146" x2="240" y2="136"/><line x1="268" y1="146" x2="240" y2="162"/><line x1="268" y1="172" x2="240" y2="162"/><line x1="268" y1="172" x2="240" y2="188"/><line x1="268" y1="198" x2="240" y2="188"/><line x1="268" y1="198" x2="240" y2="214"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="212" cy="146" r="4"/><circle cx="212" cy="172" r="4"/><circle cx="212" cy="198" r="4"/>
    <circle cx="240" cy="136" r="4" fill="#d4af37"/><circle cx="240" cy="162" r="4"/><circle cx="240" cy="188" r="4"/><circle cx="240" cy="214" r="4" fill="#d4af37"/>
    <circle cx="268" cy="146" r="4"/><circle cx="268" cy="172" r="4"/><circle cx="268" cy="198" r="4"/>
  </g>
  <text x="240" y="255" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#f8fafc">AI LAYER</text>
  <rect x="180" y="270" width="120" height="24" rx="12" fill="#d4af37" fill-opacity=".12" stroke="#d4af37" stroke-opacity=".6"/>
  <text x="240" y="286" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#d4af37">Human in the loop</text>

  <!-- Outputs -->
  <g font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">
    <rect x="352" y="60" width="108" height="44" rx="10" fill="#0c2236" stroke="#38bdf8" stroke-opacity=".6"/><text x="368" y="86">Chat assistant</text>
    <rect x="352" y="150" width="108" height="44" rx="10" fill="#0c2236" stroke="#38bdf8" stroke-opacity=".6"/><text x="368" y="176">Automation</text>
    <rect x="352" y="240" width="108" height="44" rx="10" fill="#0c2236" stroke="#38bdf8" stroke-opacity=".6"/><text x="368" y="266">Insights</text>
  </g>
</svg>
