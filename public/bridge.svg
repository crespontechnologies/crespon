<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="A bridge connecting where you are today with where you want to grow" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#050912"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#0ea5e9" stop-opacity=".26"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0ea5e9" stop-opacity=".18"/><stop offset="1" stop-color="#0ea5e9" stop-opacity=".02"/></linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#bg)"/>
  <circle cx="240" cy="150" r="170" fill="url(#glow)"/>

  <!-- Title -->
  <text x="240" y="48" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#d4af37">CRESCO + PONS</text>
  <text x="240" y="68" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Grow + Bridge = Crespon</text>

  <!-- Water -->
  <rect x="150" y="262" width="180" height="98" fill="url(#water)"/>
  <path d="M150 288q15-8 30 0t30 0 30 0 30 0 30 0" fill="none" stroke="#38bdf8" stroke-opacity=".3"><animate attributeName="d" dur="4s" repeatCount="indefinite" values="M150 288q15-8 30 0t30 0 30 0 30 0 30 0;M150 288q15 8 30 0t30 0 30 0 30 0 30 0;M150 288q15-8 30 0t30 0 30 0 30 0 30 0"/></path>
  <path d="M150 312q15-8 30 0t30 0 30 0 30 0 30 0" fill="none" stroke="#38bdf8" stroke-opacity=".18"/>

  <!-- Banks -->
  <path d="M0 250H150V360H0Z" fill="#0f172a" stroke="#1e293b"/>
  <path d="M330 250H480V360H330Z" fill="#0f172a" stroke="#1e293b"/>

  <!-- Arch bridge -->
  <path d="M150 250C190 140 290 140 330 250" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.4">
    <line x1="171.6" y1="207.9" x2="171.6" y2="250"/>
    <line x1="189.4" y1="188.1" x2="189.4" y2="250"/>
    <line x1="208.9" y1="174.9" x2="208.9" y2="250"/>
    <line x1="240" y1="167.5" x2="240" y2="250"/>
    <line x1="271.1" y1="174.9" x2="271.1" y2="250"/>
    <line x1="290.6" y1="188.1" x2="290.6" y2="250"/>
    <line x1="308.4" y1="207.9" x2="308.4" y2="250"/>
  </g>
  <line x1="146" y1="250" x2="334" y2="250" stroke="#d4af37" stroke-width="4" stroke-linecap="round"/>

  <!-- Bank labels -->
  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
    <text x="75" y="238" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#94a3b8">WHERE YOU ARE</text>
    <text x="405" y="238" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#38bdf8">WHERE YOU GROW</text>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">
    <rect x="22" y="266" width="106" height="24" rx="12" fill="#111c33" stroke="#334155"/><text x="75" y="282" fill="#cbd5e1">Problems</text>
    <rect x="22" y="298" width="106" height="24" rx="12" fill="#111c33" stroke="#334155"/><text x="75" y="314" fill="#cbd5e1">Ideas</text>
    <rect x="22" y="330" width="106" height="24" rx="12" fill="#111c33" stroke="#334155"/><text x="75" y="346" fill="#cbd5e1">Offline</text>

    <rect x="352" y="266" width="106" height="24" rx="12" fill="#0c2236" stroke="#38bdf8" stroke-opacity=".6"/><text x="405" y="282" fill="#e0f2fe">Solutions</text>
    <rect x="352" y="298" width="106" height="24" rx="12" fill="#0c2236" stroke="#38bdf8" stroke-opacity=".6"/><text x="405" y="314" fill="#e0f2fe">Products</text>
    <rect x="352" y="330" width="106" height="24" rx="12" fill="#0c2236" stroke="#38bdf8" stroke-opacity=".6"/><text x="405" y="346" fill="#e0f2fe">Online</text>
  </g>

  <!-- Traveller dot crossing the bridge -->
  <circle r="4.5" fill="#d4af37">
    <animateMotion dur="4s" repeatCount="indefinite" path="M150 250 L330 250"/>
  </circle>
</svg>
