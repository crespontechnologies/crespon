  <polyline points="73,274 101,268 129,270 157,260 185,262 213,252 241,254 269,244 297,240 325,234 353,236 381,226" fill="none" stroke="#d4af37" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="381" cy="226" r="4" fill="#d4af37"/>
